[build]
  dockerfilePath = "Dockerfile"

[deploy]
  healthcheckPath = "/health"
  healthcheckTimeout = 300
  restartPolicyType = "on-failure"
  restartPolicyMaxRetries = 3

[[services]]
  name = "openclaw"

  [services.build]
    dockerfilePath = "Dockerfile"

  [services.deploy]
    startCommand = "node src/server.js"

  [[services.variables]]
    name = "SETUP_PASSWORD"
    description = "Password for /onboard, /lite, /tui, /tools pages"
    required = true
    generateValue = true

  [[services.variables]]
    name = "OPENCLAW_STATE_DIR"
    defaultValue = "/data/.openclaw"

  [[services.variables]]
    name = "OPENCLAW_WORKSPACE_DIR"
    defaultValue = "/data/workspace"

  [[services.variables]]
    name = "OPENCLAW_GATEWAY_TOKEN"
    description = "Internal gateway auth token"
    generateValue = true

  [[services.variables]]
    name = "PORT"
    defaultValue = "8080"

  [[services.variables]]
    name = "ANTHROPIC_API_KEY"
    description = "Anthropic API key — enables Claude Code CLI and Claude models"

  [[services.variables]]
    name = "OPENAI_API_KEY"
    description = "OpenAI API key — enables OpenAI Codex CLI and GPT models"

  [[services.variables]]
    name = "GEMINI_API_KEY"
    description = "Google Gemini API key — enables Gemini CLI and Gemini models"

  [[services.variables]]
    name = "OPENROUTER_API_KEY"
    description = "OpenRouter API key — enables all OpenRouter models"

  [[services.variables]]
    name = "TELEGRAM_BOT_TOKEN"
    description = "Telegram bot token from @BotFather"

  [[services.variables]]
    name = "DISCORD_BOT_TOKEN"
    description = "Discord bot token"

  [[services.variables]]
    name = "SLACK_BOT_TOKEN"
    description = "Slack bot token (xoxb-...)"

  [[services.variables]]
    name = "SLACK_APP_TOKEN"
    description = "Slack app token (xapp-...)"

  [[services.variables]]
    name = "SIGNAL_PHONE_NUMBER"
    description = "Your phone number for Signal channel (E.164 format: +1234567890)"

  [[services.variables]]
    name = "GOOGLE_OAUTH_CREDENTIALS_B64"
    description = "Base64-encoded Google OAuth credentials.json — enables Gmail, Calendar, Drive via gog skill"

  [[services.variables]]
    name = "BRAVE_SEARCH_API_KEY"
    description = "Brave Search API key — enables Brave Search MCP server"

  [[services.variables]]
    name = "GITHUB_TOKEN"
    description = "GitHub Personal Access Token (repo scope) — enables GitHub MCP server"

  [[services.variables]]
    name = "OPENCLAW_VERSION"
    description = "Pin OpenClaw version e.g. v2026.2.19 — leave empty for latest stable auto-detect"

  [[services.variables]]
    name = "MCP_SERVERS"
    description = "Comma-separated extra MCP packages to add e.g. context7,@myorg/mcp"
    defaultValue = ""

  [[services.variables]]
    name = "ENABLE_WEB_TUI"
    defaultValue = "true"
